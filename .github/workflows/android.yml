name: Android APKs (Debug + Release performance test)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Keep the project's existing debug signing configuration unchanged.
      - name: Create CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Temporary CI-only signing key for a performance-comparison release build.
      # The app's Gradle signing configuration and application source remain untouched.
      - name: Create temporary release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci-release-test.jks \
            -storepass ci-test-password \
            -alias upload \
            -keypass ci-test-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Performance Test,O=Temporary,C=US"

      - name: Build release APK for performance comparison
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release-test.jks
          STORE_PASSWORD: ci-test-password
          KEY_PASSWORD: ci-test-password
        run: gradle --no-daemon assembleRelease

      - name: Upload release test APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-performance-test.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
